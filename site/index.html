<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Forti CLI Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one dark workstation. Left: a running CLI (prompt pinned at the bottom, `?`-style listing above it).
   Right: an inspector for the highlighted command, with its own row cursor, the composed block pinned on top
   and a key-hint line at the bottom. Phone: the CLI fills the screen; the inspector slides over it. */
:root{
  color-scheme:dark;
  --t-bg:#0c0f0d; --t-bg2:#111512; --t-fg:#d6ddd6; --t-dim:#7f8a81; --t-faint:#4f5a52; --t-line:#1f2621;
  --t-prompt:#f0a35e; --t-sel:#1b241e; --t-selbar:#f0a35e; --t-match:#ffd27a;
  --t-config:#7fd1b6; --t-diagnose:#d0a3e0; --t-execute:#f0a35e; --t-get:#95b8ea; --t-show:#95b8ea;
  --i-bg:#121714; --i-bg2:#171d19; --i-line:#232b25; --i-fg:#dfe5df; --i-dim:#8d988f; --i-faint:#5c675f;
  --i-cur:#1f2a22; --i-on:#f0a35e; --i-bad:#ff7b6b; --i-block:#0a0d0b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{background:var(--t-bg);color:var(--t-fg);font:14px/1.45 var(--sans);margin:0;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit}
kbd{font:11px var(--mono);color:var(--i-dim);border:1px solid var(--i-line);border-radius:3px;padding:0 4px;background:transparent}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.app{grid-template-columns:minmax(380px,46fr) minmax(0,54fr)}}

/* ---------- terminal ---------- */
.term{background:var(--t-bg);color:var(--t-fg);font:13.5px/1.55 var(--mono);display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--t-line);color:var(--t-dim);font:12px var(--mono);flex:none}
.tbar b{color:var(--t-fg);font-weight:500}
.tbar .dot{width:8px;height:8px;border-radius:50%;background:var(--t-prompt);box-shadow:0 0 8px var(--t-prompt)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 16px 6px;min-height:0;scrollbar-color:var(--t-faint) transparent}
.hist{margin-bottom:10px}
.hl{white-space:pre-wrap;overflow-wrap:anywhere}
.hl .pr{color:var(--t-prompt)}
.hl.res{color:var(--t-dim);cursor:pointer}
.hl.res:hover{color:var(--t-fg)}
.hl.res .arrow{color:var(--t-faint)}
.hl.sysl{color:var(--t-dim);white-space:pre-wrap}
.banner{color:var(--t-dim);margin-bottom:12px}
.banner b{color:var(--t-fg);font-weight:500}
.banner .ex{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.banner .ex button{border:0;background:none;color:var(--t-config);font:inherit;cursor:pointer;padding:2px 0;text-align:left}
.banner .ex button:hover{text-decoration:underline}
.live{border-top:1px dashed var(--t-line);padding-top:6px}
.li{display:grid;grid-template-columns:minmax(0,max-content) minmax(4ch,1fr) auto;gap:0 14px;align-items:baseline;padding:1px 8px 1px 10px;margin:0 -8px 0 -10px;border-left:2px solid transparent;cursor:pointer;min-width:0}
.li:hover{background:color-mix(in srgb,var(--t-sel) 60%,transparent)}
.li.sel{background:var(--t-sel);border-left-color:var(--t-selbar)}
.li .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;unicode-bidi:plaintext}
.li .c .v{color:var(--kc)}
.li .c mark{background:none;color:var(--t-match);font-weight:600;padding:0}
.li .h{color:var(--t-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.li .t{color:var(--t-faint);font-size:11.5px;white-space:nowrap}
.li .t .o{color:var(--t-config)}
.li .t .o.pa{color:var(--t-faint)}
.li .t .o.dv{color:var(--t-faint);font-style:italic}
.og.alt{border-left-color:var(--i-faint)}
.og.alt b{color:var(--i-dim)}
.li.p .c{padding-left:2ch;color:var(--t-fg)}
.li.p .c::before{content:"\2514 ";color:var(--t-faint)}
.li.sel .c{white-space:normal;overflow:visible;direction:ltr;overflow-wrap:anywhere;grid-column:1/3}
.li.sel .t{grid-column:3;grid-row:1}
.li.sel .h{grid-column:1/-1;grid-row:2;white-space:normal;overflow:hidden;color:color-mix(in srgb,var(--t-fg) 78%,var(--t-dim));padding:1px 0 3px 2ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;max-height:6em}
.li.p.sel .h{padding-left:4ch}
.more{color:var(--t-faint);padding:2px 0}
.none{color:var(--t-dim)}
.line{flex:none;position:relative;border-top:1px solid var(--t-line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--t-bg2)}
.ghost{color:var(--t-faint);font-size:12px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost b{color:var(--t-dim);font-weight:500}
.ghost kbd{margin-left:6px}
.prompt-row{display:flex;align-items:center;gap:8px;min-width:0}
.ctx{border:0;background:none;color:var(--t-prompt);font:500 15px var(--mono);cursor:pointer;padding:6px 0;white-space:nowrap;flex:none}
.ctx:hover{text-decoration:underline dotted;text-underline-offset:4px}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--t-fg);font:16px var(--mono);padding:6px 0;outline:0;caret-color:var(--t-prompt)}
#q::placeholder{color:var(--t-faint)}
.ctxp{position:absolute;left:16px;right:16px;bottom:calc(100% + 8px);background:var(--t-bg2);border:1px solid var(--t-line);border-radius:8px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:560px;z-index:4}
.ctxp h4{margin:0 0 6px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--t-dim)}
.ctxp .grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ctxp .opt{border:1px solid var(--t-line);background:transparent;color:var(--t-dim);border-radius:6px;padding:6px 10px;font:12.5px var(--mono);cursor:pointer;min-height:34px;text-align:left}
.ctxp .opt small{display:block;font:11px var(--sans);color:var(--t-faint)}
.ctxp .opt[aria-pressed="true"]{color:var(--t-fg);border-color:var(--t-prompt);background:color-mix(in srgb,var(--t-prompt) 12%,transparent)}
.ctxp .opt.all{border-style:dashed}
.optw{display:inline-flex}
.optw .opt{border-top-right-radius:0;border-bottom-right-radius:0}
.ctxp .tick{border:1px solid var(--t-line);border-left:0;background:transparent;color:var(--t-dim);border-radius:0 6px 6px 0;min-width:34px;font:13px var(--mono);cursor:pointer}
.ctxp .tick[aria-pressed="true"]{color:var(--t-prompt);border-color:var(--t-prompt);background:color-mix(in srgb,var(--t-prompt) 12%,transparent)}
.ctxp .note{font:12px var(--sans);color:var(--t-faint);margin:0}

/* ---------- inspector ---------- */
.pane{background:var(--i-bg);color:var(--i-fg);display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;border-left:1px solid var(--t-line);outline:0;font:13.5px/1.5 var(--mono)}
.pane.focus{box-shadow:inset 2px 0 0 var(--i-on)}
.phead{flex:none;padding:12px 20px 0;background:var(--i-bg)}
.ihead .cmd{font:600 16px var(--mono);overflow-wrap:anywhere}
.block{margin:10px 0 0;background:var(--i-block);border:1px solid var(--i-line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.block pre{margin:0;font:13px/1.45 var(--mono);color:var(--i-fg);white-space:pre;overflow:auto;max-height:8.8em}
.bact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cbtn{border:1px solid var(--i-on);background:color-mix(in srgb,var(--i-on) 16%,transparent);color:var(--i-on);font:500 12.5px var(--mono);border-radius:5px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.cbtn kbd{border-color:color-mix(in srgb,var(--i-on) 40%,transparent);color:var(--i-on)}
.bn{font:11.5px var(--sans);color:var(--i-faint);text-align:right}
.block.pulse{animation:pulse .6s}
@keyframes pulse{0%{box-shadow:0 0 0 2px var(--i-on)}100%{box-shadow:0 0 0 2px transparent}}
.lk{border:0;background:none;color:var(--i-dim);font:12px var(--mono);cursor:pointer;padding:0}
.lk:hover{color:var(--i-fg)}
.pscroll{flex:1;overflow-y:auto;padding:10px 20px 20px;min-height:0;scrollbar-color:var(--i-faint) transparent}
.desc{color:var(--i-dim);font:13px/1.5 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;max-width:80ch}
.desc.open{-webkit-line-clamp:unset}
.blk{margin-top:16px}
.lbl{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--i-faint);margin-bottom:6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lbl span{font:12px var(--mono);letter-spacing:0;text-transform:none;color:var(--i-faint)}
.lbl .lk{font-size:12px}
details.dsc summary{list-style:none;cursor:pointer}
details.dsc summary::before{content:"\25b8";margin-right:2px}
details.dsc[open] summary::before{content:"\25be"}
.jump{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px 2px;border:1px solid var(--i-on);border-radius:6px;background:var(--i-block)}
.jump .js{color:var(--i-on);font:600 14px var(--mono)}
.jump input{flex:1;min-width:0;border:0;background:transparent;color:var(--i-fg);font:13.5px var(--mono);outline:0;padding:1px 0}
.jump input::placeholder{color:var(--i-faint)}
.jump .jn{color:var(--i-dim);font:12px var(--mono);white-space:nowrap}
.jump .jk{color:var(--i-faint);font:11.5px var(--sans);white-space:nowrap}
@media (max-width:899px){.jump .jk{display:none}}
.rows{border-top:1px solid var(--i-line)}
.row{display:grid;grid-template-columns:2ch minmax(12ch,26ch) minmax(0,auto) minmax(0,1fr);gap:0 12px;align-items:baseline;padding:4px 8px;margin:0 -8px;border-left:2px solid transparent;cursor:pointer;min-width:0}
.row:hover{background:color-mix(in srgb,var(--i-cur) 55%,transparent)}
.row.cur{background:var(--i-cur);border-left-color:var(--i-on)}
.row .mk{color:var(--i-faint)}
.row.on .mk{color:var(--i-on)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .nm{color:var(--i-on)}
.row.sub .nm{padding-left:2ch}
.row .val{white-space:nowrap;color:var(--i-dim)}
.row .hp{color:var(--i-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12.5px var(--sans);min-width:0}
.row.cur .hp{white-space:normal;color:var(--i-dim)}
.row.cur .nm{white-space:normal;overflow-wrap:anywhere}
.row.grp .nm{color:var(--i-dim)}
.row.grp.cur .nm{color:var(--i-fg)}
.row.arg{grid-template-columns:2ch minmax(0,auto) minmax(0,1fr)}
.row.arg .nm.full{white-space:normal;overflow-wrap:anywhere}
.opts .ov{color:var(--i-faint);padding:0 1px;border-radius:3px}
.opts .ov.df{text-decoration:underline dotted;text-underline-offset:3px}
.opts .ov.on{color:var(--i-fg);background:var(--i-line)}
.row.on .opts .ov.on{color:var(--i-on);background:color-mix(in srgb,var(--i-on) 16%,transparent)}
.opts .bar{color:var(--i-faint);padding:0 3px}
.tv b{color:var(--i-on);font-weight:500}
.tv .dfv{color:var(--i-faint)}
.tv .rg{color:var(--i-faint);font-size:11.5px}
.tv.bad b{color:var(--i-bad)}
.vin{width:14ch;background:var(--i-block);border:1px solid var(--i-on);border-radius:4px;color:var(--i-fg);font:13px var(--mono);padding:1px 6px;outline:0}
.vin.bad{border-color:var(--i-bad)}
.more-info{grid-column:2/-1;padding:4px 0 2px;display:grid;gap:4px}
.more-info .meta{color:var(--i-faint);font:12px var(--sans)}
.more-info .odesc{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font:12.5px var(--sans);color:var(--i-dim)}
.more-info .odesc b{font:500 12.5px var(--mono);color:var(--i-fg)}
.og{font:12.5px/1.45 var(--sans);color:var(--i-dim);border-left:2px solid var(--i-on);padding:2px 0 2px 10px;margin:4px 0 6px}
.og b{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--i-on);margin-right:6px}
.ocap{color:var(--i-dim);font:13px var(--sans);margin-bottom:4px}
.ocmd{display:flex;gap:10px;align-items:baseline;color:var(--t-prompt)}
.ocmd span{flex:1;min-width:0;overflow-wrap:anywhere}
.opre{margin:6px 0 4px;background:var(--i-block);border:1px solid var(--i-line);border-radius:6px;padding:10px 12px;font:12.5px/1.45 var(--mono);color:var(--i-fg);white-space:pre;overflow:auto;max-height:440px}
.osrc,.srcline{color:var(--i-faint);font:11.5px var(--sans)}
.srcline{margin-top:20px}
.hints{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 20px;border-top:1px solid var(--i-line);color:var(--i-faint);font:11.5px var(--sans)}
.empty-pane{color:var(--i-dim);max-width:60ch;font:13.5px/1.55 var(--sans)}
.empty-pane p{margin:0 0 10px}
.empty-pane .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.pback{display:none}
@media (max-width:899px){
  .pane{position:fixed;inset:0;z-index:10;transform:translateX(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);border-left:0}
  .pane.open{transform:none}
  .pback{display:flex;align-items:center;border:0;background:none;color:var(--i-on);font:500 14px var(--sans);padding:6px 0 4px;cursor:pointer;min-height:40px}
  .phead{padding:4px 16px 0}
  .pscroll{padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .row{grid-template-columns:2ch minmax(0,1fr) auto;padding:7px 8px}
  .row .hp{grid-column:2/-1;grid-row:2}
  .row.arg{grid-template-columns:2ch minmax(0,1fr)}
  .row.arg .hp{grid-column:2}
  .more-info{grid-column:2/-1}
}
@media (prefers-reduced-motion:reduce){.pane{transition:none}.block.pulse{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t-bg2);color:var(--t-fg);border:1px solid var(--t-line);font:12.5px var(--mono);padding:6px 12px;border-radius:6px;z-index:20;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:focus-visible{outline:1px solid var(--t-prompt);outline-offset:2px}
#q:focus-visible,.pane:focus-visible{outline:0}
</style>
</head>
<body>

<div class="app">
  <section class="term" aria-label="CLI">
    <div class="tbar"><span class="dot" aria-hidden="true"></span><b>forti-cli-finder</b></div>
    <div class="scroll" id="scroll"><div id="hist"></div><div id="live"></div></div>
    <div class="line">
      <div id="ctxwrap"></div>
      <div class="ghost" id="ghost"></div>
      <div class="prompt-row"><button class="ctx" id="ctx" type="button" aria-haspopup="dialog" title="Platform, firmware and command type">FGT-7.6.4 #</button><input id="q" type="text" placeholder="type a command, a prefix or a topic" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Command line"></div>
    </div>
  </section>
  <section class="pane" id="pane" tabindex="0" aria-label="Inspector"><div class="phead" id="phead"></div><div class="pscroll" id="pscroll"></div><div class="hints" id="hints" hidden></div></section>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
const PRODUCTS=[
  {id:'fortios',short:'FGT',name:'FortiOS',vers:[{v:'7.6.7',f:'fortios',src:'CLI Reference + Administration Guide'}]},
  {id:'fortiswitch',short:'FSW',name:'FortiSwitchOS',vers:[{v:'7.6.7',f:'fortiswitch',src:'CLI Reference + Administration and FortiLink guides'}]},
  {id:'fortianalyzer',short:'FAZ',name:'FortiAnalyzer',vers:[{v:'7.6.7',f:'fortianalyzer',src:'CLI Reference + Administration Guide'}]},
  {id:'fortimanager',short:'FMG',name:'FortiManager',vers:[{v:'7.6.7',f:'fortimanager',src:'CLI Reference + Administration Guide'}]}];
// To add a build: put its bundle in data/ and add {v,f,src} to that platform's vers. /ver lists and picks them.
PRODUCTS.forEach(P=>{
  Object.defineProperty(P,'ver',{get(){const v=(S.ver||{})[P.id];return P.vers.some(x=>x.v===v)?v:P.vers[0].v}});
  Object.defineProperty(P,'file',{get(){return P.vers.find(x=>x.v===P.ver).f}});
});
const KINDS=['config','diagnose','execute','get','show'];
const SYN={mlag:['mclag'],'mc-lag':['mclag'],span:['mirror'],lag:['trunk'],etherchannel:['trunk'],'port-channel':['trunk'],dot1x:['802-1x','802.1x','8021x'],pcap:['sniffer'],capture:['sniffer'],cluster:['ha'],fgcp:['ha'],diag:['diagnose'],exec:['execute'],conf:['config'],sh:['show'],int:['interface'],intf:['interface'],fw:['firewall'],vd:['vdom'],rt:['router'],rtr:['router'],sys:['system'],svc:['service'],acl:['access-list']};
const STOP=new Set(['when','the','a','an','to','of','on','in','is','for','and','with','from','by','it','my','how','do','i','does','what']);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={prod:store.get('cf.prod',['fortios']),kind:(k=>k.length?k:KINDS.slice())(store.get('cf.kind',[])),prevProd:null,prevKind:null,
  q:'',sel:0,res:{toks:[],hits:[],total:0},items:[],hist:store.get('cf.hist',[]),ctxOpen:false,sheet:false,pinned:false,
  ver:store.get('cf.ver',{}),
  detail:null,vals:{},pins:new Set(),xp:new Set(),groups:new Set(),showAll:false};
const DATA={},LOADING={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- data ----------
async function load(id){
  if(DATA[id])return DATA[id]; if(LOADING[id])return LOADING[id];
  LOADING[id]=(async()=>{
    // Plain JSON: any static host worth using (GitHub Pages included) gzips it in
    // transit, which beats shipping a base64 copy the page has to decode itself.
    const f='data/'+PRODUCTS.find(x=>x.id===id).file+'.json';
    const r=await fetch(f);
    if(!r.ok)throw new Error(f+': HTTP '+r.status);
    const b=await r.json();
    b.secs.forEach((s,i)=>{
      s.i=i;s.prod=b.id;s.short=b.short;s.doc=b.doc;
      s.words=(s.k+' '+s.p).toLowerCase().split(/\s+/).filter(Boolean);
      s.full=s.words.join(' ');
      s.cap=(s.o||[]).map(o=>o.cap).filter(Boolean);
      if(!s.d&&s.cap.length)s.d=s.cap.slice().sort((a,b)=>a.length-b.length)[0];
      s.text=(s.p+' '+s.d+' '+s.cap.join(' ')).toLowerCase();
      s.otext=(s.o||[]).map(o=>o.t).join(' ').toLowerCase();
      s.srcdoc=s.ag?b.ag:b.doc;
      if(s.mi!=null&&b.models)s.ml=b.models[s.mi];   // "available for model(s): ...", stored once
      s.x.forEach((p,j)=>{p.j=j;p.kl=p.k.toLowerCase();p.tl=(p.n+' '+p.d+' '+(p.o||[]).map(o=>o[0]+' '+o[1]).join(' ')).toLowerCase()});
      s.ptext=s.x.map(p=>p.kl).join(' ');
      // root edit line, e.g. "edit <name>", from the syntax block
      const m=(s.s||'').split('\n').slice(1,3).map(l=>l.trim()).find(l=>/^edit /.test(l));
      s.edit=m||'';
    });
    // Most commands have no sample of their own: the guides show `diagnose sys session stat`
    // but not each of its leaves. Point those at the nearest ancestor that does have one --
    // shown separately and labelled, never as if it were this command's own output.
    const byPath={};
    b.secs.forEach(s=>{byPath[s.k+' '+s.p]=s});
    b.secs.forEach(s=>{
      if((s.o||[]).length||s.k==='config')return;   // config prints nothing, so it needs none
      const w=(s.k+' '+s.p).split(' ');
      for(let i=w.length-1;i>=2;i--){
        const a=byPath[w.slice(0,i).join(' ')];
        if(a&&(a.o||[]).length){s.po=a;break}

}

// ---------- search ----------
function toks(q){let t=q.toLowerCase().trim().split(/\s+/).filter(Boolean);if(t.length>1){const t2=t.filter(x=>!STOP.has(x));if(t2.length)t=t2}return t}
function expand(t){const a=[t];(SYN[t]||[]).forEach(s=>a.push(s));return a}
function pm(word,alts){for(const a of alts){if(word.startsWith(a))return a===word?2:1}return 0}
function walk(s,alts){ // ordered subsequence prefix match of tokens along path words

}
function pfilter(s,rest){ // params matching remaining tokens: key prefix first, else help text
  if(!rest.length)return null;
  let ps=s.x.filter(p=>rest.every(a=>pm(p.kl,a)));
  if(!ps.length)ps=s.x.filter(p=>rest.every(a=>a.some(t=>p.tl.includes(t))));
  return ps;
}
function search(q){
  const T=toks(q);
  const secs=[];
  for(const id of S.prod){const b=DATA[id];if(b)for(const s of b.secs)if(!S.kind.length||S.kind.includes(s.k))secs.push(s)}
  if(!T.length)return {toks:T,hits:[],total:secs.length};
  const alts=T.map(expand);
  const hits=[];
  for(const s of secs){
    const w=walk(s,alts);let mode=0,r=0,near=false,pf=null;
    if(w.consumed===alts.length){

      if(w.consumed===s.words.length)r+=40;
    }else if(w.consumed>0){
      const ps=s.x.filter(p=>w.rest.every(a=>pm(p.kl,a)));
      if(ps.length){mode=2;pf=ps;r=800+w.score*10+w.exact*2-w.gaps*15+(w.used[0]<=1?6:0)-(s.words.length-w.consumed)*2}
      else if(w.rest.every(a=>a.some(t=>s.text.includes(t)||s.x.some(p=>p.tl.includes(t))))){mode=3;r=400+w.score*6-w.gaps*4;pf=pfilter(s,w.rest)}
    }
    if(!mode){
      let hitn=0;r=100;
      alts.forEach(a=>{if(a.some(t=>s.full.includes(t))){r+=30;hitn++}else if(a.some(t=>s.ptext.includes(t))){r+=18;hitn++}else if(a.some(t=>s.text.includes(t))){r+=10;hitn++}else if(a.some(t=>s.x.some(p=>p.tl.includes(t)))){r+=6;hitn++}else if(a.some(t=>t.length>=4&&s.otext.includes(t))){r+=2;hitn++}});

      const phrase=T.join(' ');if(phrase.length>=8&&s.otext.includes(phrase)){r+=80;hitn=alts.length}

// ---------- compose ----------

  const ek=editKey(s);

  let n=0;  // lines the block actually emits, so the counter cannot claim more than you see

  chosen.filter(([p])=>p.t).forEach(([p,v])=>{(subs[p.t]=subs[p.t]||[]).push([p,v])});

    // Arguments are positional -- the guide prints them in one line, e.g.

    // last one you filled in, leaving the placeholder for any you skipped over.
    let last=-1,set=0;
    s.x.forEach((p,ix)=>{const v=S.vals[pid(s,p)];const has=v!=null&&v!=='';if(has)set++;if(has||S.pins.has(pid(s,p)))last=ix});
    const args=[];
    for(let ix=0;ix<=last;ix++){const p=s.x[ix],v=S.vals[pid(s,p)];args.push((v!=null&&v!=='')?qarg(v):p.n)}

  }
  lines.push('config '+s.p);

  const rootKey=root.find(([p])=>isTableKey(p));
  if(s.edit){
    const kv=rootKey&&rootKey[1];

  }
  root.forEach(([p,v])=>{const l=setLine(p,v);if(l)lines.push(ind+l)});

    const kv=(key&&key[1])||(idp&&idp[1]);

    subs[t].forEach(([p,v])=>{if(isKey(p)||(idp&&p===idp[0]))return;const l=setLine(p,v);if(l)lines.push(ind+'        '+l)});

function detailFilter(s){ // tokens left after the path, used to filter rows
  const T=toks(S.q);if(!T.length)return [];
  const w=walk(s,T.map(expand));return w.rest;
}
function ctl(s,p){

  if(o)return `<select class="val" data-id="${esc(id)}"><option value="">${esc(p.df?p.df+' (default)':'choose')}</option>${o.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const r=range(p);const ph=p.df?p.df:(r?r[0]+'\u2013'+r[1]:(p.ty||'value'));

function treeRow(s,p,open){

function copyText(t,btn,bar){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},700)}if(bar){bar.classList.remove('pulse');void bar.offsetWidth;bar.classList.add('pulse')}};

// ---------- rendering: terminal ----------
const LIVE_N=14;
function items(res){ // flat, selectable lines: each command, then its matching parameters
  const hits=res.hits.slice(0,LIVE_N);
  // A parameter under a hit is there to say why that hit matched. One that turns up under
  // most of them says nothing -- searching "config firewall policy" listed `policyid` below
  // every firewall table, because they all have one. Keep only the discriminating ones.
  const freq={};
  hits.forEach(h=>{const seen=new Set();(h.pf||[]).forEach(p=>{if(!seen.has(p.k)){seen.add(p.k);freq[p.k]=(freq[p.k]||0)+1}})});

  hits.forEach(h=>{
    out.push({h,p:null});
    if(h.pf&&h.pf.length&&(h.mode===2||out.length<=1)){
      const seen=new Set();
      h.pf.filter(p=>!seen.has(p.k)&&seen.add(p.k)&&(freq[p.k]||0)<CUT).slice(0,4).forEach(p=>out.push({h,p}));
    }

}
function tpath(s,T){

  return (s.k+' '+s.p).split(' ').map((x,i)=>{const t=hit.has(i)?`<mark>${esc(x)}</mark>`:esc(x);return i===0?`<span class="v">${t}</span>`:t}).join(' ');
}
function liveHtml(){
  if(!S.q.trim())return '';
  const loading=S.prod.some(id=>!DATA[id]);
  if(!S.res.hits.length)return `<div class="live"><div class="none">${loading?'loading reference data\u2026':'% no command or help text matches \u201c'+esc(S.q.trim())+'\u201d'}</div></div>`;
  const multi=S.prod.length>1;
  const rows=S.items.map((it,n)=>{
    const s=it.h.s,sel=n===S.sel;
    if(it.p){const p=it.p;return `<div class="li p${sel?' sel':''}" data-it="${n}"><span class="c">${esc(p.k)}</span><span class="h">${esc(p.d||p.n)}</span><span class="t">${esc(p.df||'')}</span></div>`}
    return `<div class="li${sel?' sel':''}" data-it="${n}" style="--kc:var(--t-${s.k})"><span class="c">${tpath(s,S.res.toks)}</span><span class="h">${s.d?esc(s.d):(s.ml?'available on '+s.ml.length+' models':'')}</span><span class="t">${s.dv?'<span class="o dv">derived</span> ':''}${s.o?'<span class="o">out</span> ':(s.po?'<span class="o pa">out\u2191</span> ':'')}${multi?esc(s.short):''}</span></div>`;
  }).join('');
  const more=S.res.hits.length>LIVE_N?`<div class="more">\u2026 ${S.res.hits.length-LIVE_N} more, keep typing to narrow</div>`:'';
  return `<div class="live">${rows}${more}</div>`;

// ---------- slash commands ----------
const PALIAS={fgt:'fortios',fortigate:'fortios',fortios:'fortios',fos:'fortios',fsw:'fortiswitch',fortiswitch:'fortiswitch',switch:'fortiswitch',faz:'fortianalyzer',fortianalyzer:'fortianalyzer',fmg:'fortimanager',fortimanager:'fortimanager'};
const KALIAS={config:'config',conf:'config',diagnose:'diagnose',diag:'diagnose',execute:'execute',exec:'execute',get:'get',show:'show'};
const SLASH=[
  ['/fgt','FortiGate (FortiOS 7.6.7) only'],['/fsw','FortiSwitch (FortiSwitchOS 7.6.7) only'],['/faz','FortiAnalyzer 7.6.7 only'],['/fmg','FortiManager 7.6.7 only'],
  ['/all','every platform'],
  ['/config','config commands only'],['/diag','diagnose commands only'],['/exec','execute commands only'],['/get','get commands only'],['/show','show commands only'],
  ['/any','every command type'],
  ['/ver','firmware builds: list and pick one'],['/reset','back to FortiGate, every command type'],['/clear','clear the scrollback'],['/help','list these commands']];
function slashParse(q){ // returns {prod,kind,vers,act,err}
  const toks=q.replace(/^\//,'').toLowerCase().split(/[\s,+\/]+/).filter(Boolean);
  const r={prod:[],kind:[],vers:{},act:null,err:[]};let lastP=null;
  const setVer=(P,v)=>{const m=P.vers.filter(x=>x.v===v||x.v.startsWith(v+'.'));
    if(m.length){r.vers[P.id]=m[m.length-1].v;if(!r.prod.includes(P.id))r.prod.push(P.id)}
    else r.err.push(P.short+' '+v+' is not available. '+P.short+' builds: '+P.vers.map(x=>x.v).join(', ')+'. Add its CLI reference to get it.')};
  toks.forEach(t=>{
    const at=t.split('@');const base=at[0],ver=at[1];
    if(PALIAS[base]){const P=PRODUCTS.find(p=>p.id===PALIAS[base]);lastP=P;if(!r.prod.includes(P.id))r.prod.push(P.id);if(ver)setVer(P,ver)}
    else if(KALIAS[t])r.kind.push(KALIAS[t]);
    else if(t==='all'||t==='every')r.prod.push(...PRODUCTS.map(p=>p.id));
    else if(t==='any'||t==='types'||t==='alltypes')r.kind.push(...KINDS);
    else if(['ver','version','versions','clear','cls','help','reset','?'].includes(t))r.act=r.act||t;
    else if(/^\d+(\.\d+)*$/.test(t)){
      // "/fgt@7.6.7" names its platform; a bare "/ver 7.6.7" means the one you are on.
      // Setting every platform at once from one number is not something anyone wants.
      if(lastP)setVer(lastP,t);
      else{
        const sel=PRODUCTS.filter(P=>S.prod.includes(P.id));
        if(sel.length===1)setVer(sel[0],t);
        else r.err.push('which platform? '+sel.map(P=>'/'+P.short.toLowerCase()+'@'+t).join(' or ')+'. One platform has to be selected to set a build by number.');

function slashRun(q){
  const r=slashParse(q);const lines=[];
  if(r.act==='clear'||r.act==='cls'){S.hist=[];store.set('cf.hist',S.hist);return}
  if(r.act==='help'||r.act==='?')SLASH.forEach(([c,d])=>lines.push(c.padEnd(9)+d)),lines.push('combine them: /fsw diag, /fgt fsw show, /fgt@7.6.7');
  if((r.act==='ver'||r.act==='version'||r.act==='versions')&&!Object.keys(r.vers).length){
    // list builds for what is selected, not for everything
    const sel=PRODUCTS.filter(P=>S.prod.includes(P.id));
    const show=sel.length?sel:PRODUCTS;
    show.forEach(P=>P.vers.forEach(x=>lines.push((x.v===P.ver?'* ':'  ')+P.short.padEnd(5)+x.v.padEnd(8)+P.name+' \u00b7 '+x.src)));
    if(show.length===1)lines.push('set one with /ver <build>, e.g. /ver '+show[0].vers[0].v+'.');
    else lines.push('several platforms are selected; name one to set a build: /'+show[0].short.toLowerCase()+'@'+show[0].vers[0].v+'.');
  }
  Object.entries(r.vers).forEach(([id,v])=>{if(S.ver[id]!==v){S.ver[id]=v;delete DATA[id]}});store.set('cf.ver',S.ver);
  if(r.act==='reset'){S.prod=['fortios'];S.kind=KINDS.slice()}
  if(r.prod.length)S.prod=PRODUCTS.map(p=>p.id).filter(id=>r.prod.includes(id));
  if(r.kind.length)S.kind=KINDS.filter(k=>r.kind.includes(k));

  Promise.all(S.prod.map(load)).then(()=>renderTerm());
  r.err.forEach(e=>lines.push('% '+e));
  if(r.prod.length||r.kind.length||r.act==='reset'||Object.keys(r.vers).length)lines.push('context: '+promptText());
  S.hist.push({sys:1,q:q.trim(),pr:promptText(),lines});S.hist=S.hist.slice(-40);store.set('cf.hist',S.hist);
}
function verRows(){const out=[];PRODUCTS.forEach(P=>P.vers.forEach(x=>out.push(['/'+P.short.toLowerCase()+'@'+x.v,P.name+' '+x.v+(x.v===P.ver?' \u00b7 current':'')+' \u00b7 '+x.src])));return out}
function slashMenu(){

function slashHtml(){
  const m=slashMenu();if(S.sel>=m.length)S.sel=0;
  return `<div class="live">${m.map(([c,d],n)=>`<div class="li${n===S.sel?' sel':''}" data-slash="${esc(c)}"><span class="c" style="color:var(--t-prompt)">${esc(c)}</span><span class="h">${esc(d)}</span><span class="t"></span></div>`).join('')}<div class="more">\u2191\u2193 pick \u00b7 enter runs \u00b7 tab completes \u00b7 combine: /fsw diag, /fgt fsw show, /fgt@7.6.7</div></div>`;

function slashComplete(c){ // replace the last token with c
  const parts=S.q.split(/(\s+)/);let lastIdx=parts.length-1;while(lastIdx>0&&!parts[lastIdx].trim())lastIdx--;

function completion(it){ // the full path, keeping any words the user typed past it (they filter the parameters)

function histHtml(){
  if(!S.hist.length)return `<div class="banner"><b>Forti CLI Finder</b> \u00b7 the <b>?</b> key for the Fortinet CLI guides.

  // toggle include
  const on=(S.vals[id]!=null&&S.vals[id]!=='')||S.pins.has(id);
  if(on){S.pins.delete(id);delete S.vals[id]}else S.pins.add(id);
  renderPane();
}

// ---------- actions ----------
function commit(it){
  if(!it)return;
  const s=it.h.s;const label=s.k+' '+s.p+(it.p?' \u203a '+it.p.k:'');
  const last=S.hist[S.hist.length-1];
  if(!last||last.q!==S.q.trim()||last.label!==label){S.hist.push({q:S.q.trim(),label,pr:promptText(),prod:s.prod,k:s.k,p:s.p,pk:it.p?it.p.k:''});S.hist=S.hist.slice(-40);store.set('cf.hist',S.hist)}
}
function openItem(n,user){
  const it=S.items[n];if(!it)return;
  S.sel=n;commit(it);setDetail(it.h.s,it.p,user);
  if(!isWide()){S.sheet=true;renderPane();$('#pscroll').scrollTop=0}
  S.pinned=true;
  renderTerm();
}
function copyBlock(){const s=S.detail;if(!s)return;const c=composed(s);copyText(c.text,null,null);const b=document.querySelector('.block');if(b){b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}toast('copied \u00b7 '+c.text.split('\n')[0]+(c.text.includes('\n')?' \u2026':''))}
// Clearing is one keystroke away from anything you type in the pane, so it is undoable.
function clearBlock(){
  const s=S.detail;if(!s)return;
  const n=composed(s).n;
  if(!n){S.undo=null;return}
  S.undo={s,vals:Object.assign({},S.vals),pins:new Set(S.pins)};
  S.vals={};S.pins=new Set();renderPane();
  toast('cleared '+n+' \u00b7 u to undo');
}
function undoClear(){
  const u=S.undo;
  if(!u||u.s!==S.detail){toast('nothing to undo');return}
  S.vals=u.vals;S.pins=u.pins;S.undo=null;renderPane();toast('restored');
}
function setQ(q){S.q=q;$('#q').value=q;S.sel=0;renderTerm();$('#q').focus()}
function only(group,id){S[group]=[id];afterPick(group)}
function toggle(group,id){const cur=S[group];S[group]=cur.includes(id)?(cur.length>1?cur.filter(x=>x!==id):cur):[...cur,id];const ALL=group==='prod'?PRODUCTS.map(p=>p.id):KINDS;S[group]=ALL.filter(x=>S[group].includes(x));afterPick(group)}
function afterPick(group){store.set(group==='prod'?'cf.prod':'cf.kind',S[group]);S.sel=0;if(group==='prod')Promise.all(S.prod.map(load)).then(()=>renderTerm(true));renderTerm(true)}
function allOf(group){const ALL=group==='prod'?PRODUCTS.map(p=>p.id):KINDS.slice();S[group]=ALL;afterPick(group)}

document.addEventListener('click',e=>{
  const t=e.target;
  if(S.ctxOpen&&!t.closest('#ctxp')&&!t.closest('#ctx')){S.ctxOpen=false;renderTerm(true)}
  if(t.closest('#ctx')){S.ctxOpen=!S.ctxOpen;renderTerm(true);return}
  if(t.closest('[data-prod-all]')){allOf('prod');return}
  if(t.closest('[data-kind-all]')){allOf('kind');return}
  const vb=t.closest('[data-ver]');if(vb){const [id,v]=vb.dataset.ver.split('@');S.ver[id]=v;store.set('cf.ver',S.ver);delete DATA[id];load(id).then(()=>renderTerm(true));renderTerm(true);return}
  const op=t.closest('[data-only-prod]');if(op){only('prod',op.dataset.onlyProd);return}
  const ok=t.closest('[data-only-kind]');if(ok){only('kind',ok.dataset.onlyKind);return}
  const pr=t.closest('[data-prod]');if(pr){toggle('prod',pr.dataset.prod);return}
  const kc=t.closest('[data-kind]');if(kc){toggle('kind',kc.dataset.kind);return}
  const ct=t.closest('[data-copy-text]');if(ct){copyText(ct.dataset.copyText,null);toast('copied \u00b7 '+ct.dataset.copyText);return}
  if(t.closest('[data-copy-block]')){copyBlock();return}
  if(t.closest('[data-clear-block]')){clearBlock();return}
  if(t.closest('[data-back]')){S.sheet=false;renderPane();return}
  const on=t.closest('[data-onext]');if(on){const d=S.detail,n=((d.o&&d.o.length?d.o:(d.po&&d.po.o)||[])).length;if(n){S.oi=((S.oi||0)+(+on.dataset.onext)+n)%n;renderPane()}return}
  const all=t.closest('[data-all]');if(all){S.showAll=all.dataset.all==='1';S.cur=0;renderPane();return}
  const sl=t.closest('[data-slash]');if(sl){slashRun(slashComplete(sl.dataset.slash));setQ('');return}
  const li=t.closest('[data-it]');if(li){openItem(+li.dataset.it,true);return}
  const hh=t.closest('[data-h]');if(hh){const h=S.hist[+hh.dataset.h];setQ(h.q);const n=S.items.findIndex(it=>it.h.s.k===h.k&&it.h.s.p===h.p&&(!h.pk||(it.p&&it.p.k===h.pk)));if(n>=0)openItem(n,true);return}
  const ex=t.closest('[data-q]');if(ex){setQ(ex.dataset.q);return}
  const cl=t.closest('[data-clamp]');if(cl){cl.classList.toggle('open');return}
  // inspector rows: an option value sets it, the marker toggles, a value field edits, anywhere else moves the cursor
  const ov=t.closest('[data-v]');if(ov){const id=ov.dataset.vid;S.vals[id]=ov.dataset.v;S.pins.add(id);const rw=ov.closest('[data-row]');if(rw)S.cur=+rw.dataset.row;renderPane();return}
  const ed=t.closest('[data-edit]');if(ed){const rw=ed.closest('[data-row]');if(rw)S.cur=+rw.dataset.row;S.edit=ed.dataset.edit;renderPane();return}
  const rw=t.closest('[data-row]');if(rw){const i=+rw.dataset.row;const r=S.rows[i];const wasCur=S.cur===i;S.cur=i;
    if(t.closest('[data-pin]')||r.type==='arg'||r.type==='grp'||(wasCur&&!isWide()))rowAct(r,'toggle');else renderPane();return}
  if(t.closest('#pane')&&!t.closest('input,button,summary,a'))focusPane();
});
document.addEventListener('focusin',e=>{if(!e.target.closest('#pane'))$('#pane').classList.remove('focus')});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S.sel=0;S.slashMoved=false;S.pinned=false;renderTerm();return}
  if(e.target.id==='jin'){S.jump=e.target.value;renderPane();const n=S.rows.findIndex(r=>r.id===S.jumpBest);if(n>=0){S.cur=n;curIntoView()}return}
  if(e.target.id==='vin'&&S.detail){
    const v=e.target;S.vals[v.dataset.vid]=v.value;
    const p=S.detail.x.find(p=>pid(S.detail,p)===v.dataset.vid);const r=p&&range(p);
    v.classList.toggle('bad',!!(v.value!==''&&r&&(isNaN(+v.value)||+v.value<r[0]||+v.value>r[1])));
    $('#cpre').textContent=composed(S.detail).text;
  }
});
function paneKeys(e){
  const k=e.key;const r=S.rows[S.cur];
  if(k==='ArrowDown'||k==='j'){e.preventDefault();S.cur=Math.min(S.rows.length-1,S.cur+1);renderPane();curIntoView();return}
  if(k==='ArrowUp'||k==='k'){e.preventDefault();S.cur=Math.max(0,S.cur-1);renderPane();curIntoView();return}
  if(k==='PageDown'){e.preventDefault();S.cur=Math.min(S.rows.length-1,S.cur+10);renderPane();curIntoView();return}
  if(k==='PageUp'){e.preventDefault();S.cur=Math.max(0,S.cur-10);renderPane();curIntoView();return}
  if(k==='Home'){e.preventDefault();S.cur=0;renderPane();$('#pscroll').scrollTop=0;return}
  if(k==='End'){e.preventDefault();S.cur=S.rows.length-1;renderPane();curIntoView();return}
  if(k==='ArrowLeft'||k==='h'){e.preventDefault();rowAct(r,'left');return}
  if(k==='ArrowRight'||k==='l'){e.preventDefault();rowAct(r,'right');return}
  if(k===' '){e.preventDefault();rowAct(r,'toggle');return}
  if(k==='Enter'){e.preventDefault();rowAct(r,'edit');return}
  if(k==='c'||k==='y'){e.preventDefault();copyBlock();return}
  if(k==='x'){e.preventDefault();clearBlock();return}
  if(k==='u'){e.preventDefault();undoClear();return}
  if(k==='a'){e.preventDefault();S.showAll=!S.showAll;S.cur=0;renderPane();return}
  if(k==='n'||k==='p'){e.preventDefault();const d=S.detail,n=((d.o&&d.o.length?d.o:(d.po&&d.po.o)||[])).length;if(n){S.oi=((S.oi||0)+(k==='n'?1:-1)+n)%n;renderPane()}return}
  if(k==='Escape'||k==='Tab'||k==='q'){e.preventDefault();$('#pane').classList.remove('focus');if(!isWide()){S.sheet=false;renderPane()}$('#q').focus();return}
  if(k==='/'){e.preventDefault();openJump();return}
}
document.addEventListener('keydown',e=>{
  const inQ=e.target===$('#q');
  if(e.target.id==='jin'){ // jumping to a parameter by name
    if(e.key==='Enter'){e.preventDefault();closeJump(true);return}
    if(e.key==='Escape'){e.preventDefault();closeJump(false);return}
    if(e.key==='ArrowDown'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();jumpStep(1);return}
    if(e.key==='ArrowUp'||(e.key==='Tab'&&e.shiftKey)){e.preventDefault();jumpStep(-1);return}
    return;
  }
  if(e.target.id==='vin'){ // editing a value in the inspector
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();const id=S.edit;if((S.vals[id]??'')!=='')S.pins.add(id);S.edit=null;renderPane();focusPane();return}
    if(e.key==='Escape'){e.preventDefault();S.edit=null;renderPane();focusPane();return}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(!S.detail&&S.items[S.sel])setDetail(S.items[S.sel].h.s,S.items[S.sel].p,true);copyBlock();return}
  if(e.ctrlKey&&(e.key==='l'||e.key==='L')){e.preventDefault();S.hist=[];store.set('cf.hist',S.hist);renderTerm();return}
  if(e.target.closest&&e.target.closest('#pane')&&S.detail&&!e.target.closest('input,select,textarea,button,summary')){paneKeys(e);return}
  if(e.target.closest&&e.target.closest('#pane')&&e.key==='Escape'){$('#q').focus();return}
  if(e.key==='Escape'){if(S.ctxOpen){S.ctxOpen=false;renderTerm(true)}else if(S.sheet){S.sheet=false;renderPane()}else{setQ('')}return}
  if(e.key==='/'&&!inQ&&!e.target.closest('input,select,textarea')){e.preventDefault();setQ('/');return}
  if(!inQ)return;
  if(S.q.startsWith('/')){
    const m=slashMenu();
    if(e.key==='Tab'){e.preventDefault();if(m[S.sel])setQ(slashComplete(m[S.sel][0]));return}
    if(e.key==='ArrowDown'){e.preventDefault();S.sel=Math.min(m.length-1,S.sel+1);S.slashMoved=true;renderTerm(true);scrollSel();return}
    if(e.key==='ArrowUp'){e.preventDefault();S.sel=Math.max(0,S.sel-1);S.slashMoved=true;renderTerm(true);scrollSel();return}
    if(e.key==='Enter'){e.preventDefault();
      // Only take the highlighted menu row if the cursor was actually moved onto it.
      // Bare "/ver" used to auto-pick the first build in the menu, so you could never
      // just ask what builds there are.
      const q=S.slashMoved&&m[S.sel]?slashComplete(m[S.sel][0]):slashResolve(S.q,m[S.sel]);
      S.slashMoved=false;slashRun(q);setQ('');return}
    return;
  }
  if(e.key==='Tab'&&!e.shiftKey){
    const it=S.items[S.sel];if(!it)return;e.preventDefault();
    const comp=completion(it);
    if(S.q.trim()!==comp){setQ(comp+' ');return}
    openItem(S.sel,true);focusPane();return}
  if(e.key==='ArrowDown'){e.preventDefault();if(S.items.length){S.sel=Math.min(S.items.length-1,S.sel+1);renderTerm(true);scrollSel()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(S.items.length){S.sel=Math.max(0,S.sel-1);renderTerm(true);scrollSel()}}
  else if(e.key==='Enter'){e.preventDefault();if(S.items.length){openItem(S.sel,true);if(isWide())focusPane()}}
});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX<24?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(sx!=null&&S.sheet&&e.changedTouches[0].clientX-sx>80){S.sheet=false;renderPane()}sx=null},{passive:true});
matchMedia('(min-width:900px)').addEventListener('change',()=>{S.sheet=false;renderPane();renderTerm(true)});

(async function boot(){
  renderTerm();renderPane();
  await Promise.all(S.prod.map(id=>load(id).then(()=>renderTerm(),()=>{})));
  renderTerm();
  PRODUCTS.filter(p=>!S.prod.includes(p.id)).forEach(p=>load(p.id).catch(()=>{}));
  if(matchMedia('(pointer:fine)').matches)$('#q').focus();
})();

})();
</script>
