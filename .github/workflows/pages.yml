name: Deploy to Pages

# site/ is committed complete -- index.html plus the built data bundles -- so a deploy
# is a file copy and takes seconds. Rebuilding the data needs ~500MB of Fortinet PDFs,
# which is the refresh workflow's job, not this one's.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the bundles are present and parse
        run: |
          set -e
          for f in site/data/*.json; do
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); \
              print(f'{sys.argv[1]}: {len(d[\"secs\"])} sections')" "$f"
          done
          test -f site/index.html
          test -f site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
